name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup GOST OpenSSL engine
        run: |
          sudo apt-get install -y libengine-gost-openssl1.1
          sudo cp tests/openssl.cnf /usr/lib/ssl/openssl.cnf

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run tests
        run: |
          chmod 000 tests/_data/non_readable_file
          vendor/bin/codecept build
          vendor/bin/codecept run

  static-analysis:
    runs-on: ubuntu-24.04
    name: Static analysis
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  coding-standards:
    runs-on: ubuntu-24.04
    name: Coding standards
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check composer.json normalization
        run: composer normalize --dry-run --no-interaction

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

  gost-roundtrip:
    runs-on: ubuntu-24.04
    name: GOST signing round-trip
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup GOST OpenSSL engine
        run: |
          sudo apt-get install -y libengine-gost-openssl1.1
          sudo cp tests/openssl.cnf /usr/lib/ssl/openssl.cnf

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Sign and verify a GOST-2012 signature
        run: |
          vendor/bin/codecept build
          vendor/bin/codecept run -g gost
